<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SaraGym"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>SaraGym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#07080B"><meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>/* SaraGym v3 — estudio de entrenamiento futurista.
   VOZ: entrenadora de élite, directa y cálida. IDEA: un HUD de laboratorio de movimiento.
   COLOR: negro azulado profundo, cristal oscuro, rojo de energía con brillo, naranja para el músculo.
   TIPO: Archivo condensada en mayúsculas para lo grande, Archivo normal para leer, JetBrains Mono para datos.
   LAYOUT: columna móvil, capas de cristal con profundidad y luz roja ambiental. */
:root {
  --bg: #07080B; --bg1: #0C0E13; --bg2: #12151C; --bg3: #1A1E27; --bg4: #232835;
  --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.12);
  --ink: #F4F5F8; --ink2: #A9AEBB; --ink3: #737988;
  --red: #FF2D46; --red2: #E3132F; --red-soft: rgba(255,45,70,.16); --red-tint: rgba(255,45,70,.07);
  --orange: #FF6A2A; --good: #2EE59D; --good-soft: rgba(46,229,157,.13); --warn: #FFB020; --blue: #8FA8FF;
  --carb: #FFB020; --prot: #FF2D46; --fat: #9D8FFF;
  --glass: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r-lg: 22px; --r-md: 16px; --r-sm: 11px;
  --nav-h: 68px; --head-h: 58px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(600px 420px at 95% -5%, rgba(255,45,70,.22), transparent 70%), radial-gradient(520px 420px at -10% 105%, rgba(143,168,255,.10), transparent 70%),
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px) 0 0 / 28px 28px, linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px) 0 0 / 28px 28px, var(--bg); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: rgba(7,8,11,.9); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 8px; }
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink2); }
.small { font-size: 13px; }
.up { color: var(--good); } .down { color: var(--red); } .flat { color: var(--ink3); }

/* Cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: rgba(7,8,11,.72); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); border-bottom: 1px solid var(--line); }
.top .wrap { height: var(--head-h); display: flex; align-items: center; gap: 12px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.iconbtn:active { background: var(--bg3); }
.iconbtn svg { width: 21px; height: 21px; }
.logo { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: .02em; text-transform: uppercase; font-stretch: 112%; }
.logo svg { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 0 10px rgba(255,45,70,.55)); }
.logo i { color: var(--red); font-style: italic; }
.top .chip { margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--ink2); white-space: nowrap; text-decoration: none; }
.chip svg { width: 14px; height: 14px; }
.chip.red { background: var(--red-soft); color: #FF8091; border-color: rgba(255,45,70,.3); }
.chip.hot { background: rgba(255,106,42,.16); color: #FFA27A; border-color: rgba(255,106,42,.35); }
.chip.good { background: var(--good-soft); color: var(--good); border-color: rgba(46,229,157,.3); }

/* Cajón lateral */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index: 96; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(330px, 86vw); background: linear-gradient(180deg, #10131A, #0A0C10); border-right: 1px solid var(--line2); z-index: 97; transform: translateX(-102%); transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility .3s; visibility: hidden; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); }
.drawer.on { transform: none; visibility: visible; }
.drawer .dhead { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
.drawer .dhead .logo { font-size: 22px; }
.drawer .dhead p { margin: 8px 0 0; color: var(--ink2); font-size: 13.5px; }
.dnav { overflow-y: auto; padding: 10px 10px 24px; flex: 1; }
.dnav a, .dnav summary { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer; list-style: none; }
.dnav summary::-webkit-details-marker { display: none; }
.dnav a:active, .dnav summary:active { background: var(--bg3); }
.dnav a.on { background: var(--red-soft); color: #FF8091; }
.dnav svg { width: 20px; height: 20px; flex: none; }
.dnav details > div { padding: 2px 0 6px 32px; display: grid; }
.dnav details > div a { font-weight: 500; font-size: 14.5px; padding: 9px 12px; color: var(--ink2); }
.dnav details > div a small { margin-left: auto; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; color: var(--ink3); }
.dnav details > div a.today small { color: var(--red); }
.dnav .chev { margin-left: auto; transition: transform .2s; width: 16px; height: 16px; color: var(--ink3); }
.dnav details[open] .chev { transform: rotate(90deg); }
.dfoot { padding: 14px 18px 18px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink3); }

/* Barra inferior */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: rgba(9,10,14,.82); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5); border-top: 1px solid var(--line2); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs nav { max-width: 560px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: var(--ink3); font-size: 10.5px; font-weight: 600; position: relative; }
.tabs a svg { width: 23px; height: 23px; }
.tabs a.on { color: var(--ink); }
.tabs a.on svg { color: var(--red); filter: drop-shadow(0 0 8px rgba(255,45,70,.8)); }
.tabs a.on::before { content: ""; position: absolute; top: 0; width: 28px; height: 2px; border-radius: 2px; background: var(--red); box-shadow: 0 0 12px var(--red); }

/* Títulos */
.vhead { padding-top: 22px; padding-bottom: 6px; }
.vhead h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(38px, 11vw, 52px); line-height: .92; letter-spacing: -.01em; margin: 8px 0 0; text-transform: uppercase; font-stretch: 78%; text-wrap: balance; }
.vhead h1 em { font-style: italic; color: var(--red); text-shadow: 0 0 28px rgba(255,45,70,.55); }
.vhead p { color: var(--ink2); margin: 10px 0 0; max-width: 46ch; }
h2.sec { font-family: var(--f-display); font-size: 20px; font-weight: 800; letter-spacing: .01em; text-transform: uppercase; font-stretch: 85%; margin: 30px 0 12px; display: flex; align-items: baseline; gap: 10px; }
h2.sec .mono { margin-left: auto; font-weight: 500; }
.stack { display: grid; gap: 12px; }
.backrow { padding-top: 14px; }
.backrow .link { display: inline-flex; align-items: center; gap: 4px; }
.backrow svg { width: 16px; height: 16px; }

/* Superficies */
.card { background: var(--glass); border: 1px solid var(--line2); border-radius: var(--r-lg); padding: 16px; position: relative; box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 30px rgba(0,0,0,.25); }
.card.ink { background: linear-gradient(160deg, #1B0A10, #0E0F14 60%); border-color: rgba(255,45,70,.28); color: var(--ink); }
.card.red { background: var(--red); color: #fff; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 22px; border-radius: 999px; background: linear-gradient(180deg, #FF4258, #E3132F); color: #fff; font-weight: 700; font-size: 15.5px; text-decoration: none; box-shadow: 0 8px 24px rgba(255,45,70,.38), inset 0 1px 0 rgba(255,255,255,.25); border: 0; }
.btn:active { transform: scale(.98); }
.btn.ghost { background: rgba(255,255,255,.04); border: 1px solid var(--line2); color: var(--ink); box-shadow: none; }
.btn.white { background: rgba(255,255,255,.92); color: #0B0C10; box-shadow: none; }
.btn.dark { background: var(--bg4); box-shadow: none; border: 1px solid var(--line2); }
.btn.sm { height: 38px; padding: 0 15px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.link { color: #FF6377; font-weight: 700; text-decoration: none; font-size: 14px; }

/* Héroe */
.hero { position: relative; overflow: hidden; border-radius: 26px; color: #fff; padding: 22px 18px 18px; margin-top: 14px; border: 1px solid rgba(255,45,70,.3);
  background: radial-gradient(420px 260px at 100% 0%, rgba(255,45,70,.35), transparent 70%), linear-gradient(160deg, #15161C, #0A0B0F 65%); box-shadow: 0 20px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px) 0 0 / 22px 22px; pointer-events: none; mask-image: linear-gradient(180deg, transparent, #000 60%); -webkit-mask-image: linear-gradient(180deg, transparent, #000 60%); }
.hero .mono { color: rgba(255,255,255,.55); }
.hero h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(44px, 13vw, 62px); line-height: .88; margin: 10px 0 0; text-transform: uppercase; font-stretch: 75%; position: relative; z-index: 1; }
.hero h2 em { color: var(--red); font-style: italic; text-shadow: 0 0 30px rgba(255,45,70,.7); }
.hero p { margin: 12px 0 0; color: rgba(255,255,255,.72); font-size: 14px; max-width: 30ch; position: relative; z-index: 1; }
.hero .row { display: flex; gap: 10px; align-items: center; margin-top: 18px; flex-wrap: wrap; position: relative; z-index: 1; }
.hero .timer { position: absolute; top: 16px; right: 16px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.35); backdrop-filter: blur(8px); border-radius: 14px; padding: 8px 11px; text-align: right; z-index: 2; }
.hero .timer b { display: block; font-family: var(--f-mono); font-size: 18px; color: var(--red); font-weight: 600; text-shadow: 0 0 14px rgba(255,45,70,.7); }
.hero .timer span { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .14em; color: rgba(255,255,255,.55); }
.hero .thumbstrip { display: flex; gap: 6px; margin-top: 16px; position: relative; z-index: 1; }
.hero .thumbstrip img { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; border: 1px solid var(--line2); }

/* Semana */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; }
.week a { text-decoration: none; color: var(--ink); background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 9px 0 8px; text-align: center; display: grid; gap: 4px; justify-items: center; }
.week a .d { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; color: var(--ink3); }
.week a .n { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }
.week a .s { width: 6px; height: 6px; border-radius: 50%; background: var(--bg4); }
.week a.tr .s { background: var(--red); box-shadow: 0 0 8px var(--red); }
.week a.ok .s { background: var(--good); box-shadow: 0 0 8px var(--good); }
.week a.today { background: linear-gradient(180deg, #2A0D14, #160A0E); border-color: rgba(255,45,70,.5); box-shadow: 0 0 18px rgba(255,45,70,.25); }

/* Indicadores */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--glass); border: 1px solid var(--line2); border-radius: var(--r-md); padding: 14px; display: grid; gap: 4px; min-width: 0; text-decoration: none; color: var(--ink); }
a.tile:active { transform: scale(.99); }
.tile b { font-family: var(--f-display); font-size: 30px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; font-stretch: 85%; }
.tile b small { font-size: 14px; font-weight: 700; color: var(--ink2); margin-left: 2px; }
.tile .delta { font-size: 12.5px; font-weight: 600; }
.tile.wide { grid-column: 1 / -1; }
.bar { height: 8px; border-radius: 999px; background: var(--bg4); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #FF5A6E, var(--red)); border-radius: inherit; box-shadow: 0 0 12px rgba(255,45,70,.7); }

/* Gráficos */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--f-mono); font-size: 10px; fill: var(--ink3); }
.chart .lbl { fill: var(--ink); font-weight: 600; }
.chart rect[fill="var(--ink)"] { fill: #E8EAF0; }

/* Sesión */
.blockhead { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; }
.blockhead h3 { margin: 0; font-family: var(--f-display); font-size: 17px; font-weight: 800; text-transform: uppercase; font-stretch: 85%; letter-spacing: .02em; }
.blockhead .mono { margin-left: auto; }
.exrow { display: grid; grid-template-columns: 74px minmax(0,1fr) auto; gap: 12px; align-items: center; background: var(--glass); border: 1px solid var(--line2); border-radius: var(--r-md); padding: 8px 12px 8px 8px; text-align: left; width: 100%; color: var(--ink); }
.exrow + .exrow { margin-top: 8px; }
.exrow img, .ph { width: 74px; height: 74px; border-radius: 12px; background: var(--bg3); object-fit: cover; display: block; }
.exrow .t { font-weight: 700; font-size: 15px; line-height: 1.2; }
.exrow .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.exrow .meta span { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .04em; padding: 3px 7px; border-radius: 7px; background: rgba(255,255,255,.06); color: var(--ink2); }
.exrow .meta span.r { background: var(--red-soft); color: #FF8091; }
.exrow .meta span.g { background: var(--good-soft); color: var(--good); font-weight: 600; }
.exrow .meta span.n { display: inline-flex; align-items: center; gap: 3px; background: rgba(255,176,32,.14); color: var(--warn); }
.exrow .meta span.n svg { width: 11px; height: 11px; }
.exrow.done { border-color: rgba(46,229,157,.35); background: linear-gradient(180deg, rgba(46,229,157,.09), rgba(46,229,157,.02)); }
.ring { width: 38px; height: 38px; }
.supl { border-left: 2px solid var(--red); margin-left: 6px; padding-left: 10px; box-shadow: -6px 0 14px -8px var(--red); }
.supl-tag { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; color: var(--red); text-transform: uppercase; margin: -2px 0 8px 8px; }
.checkrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--glass); border: 1px solid var(--line2); border-radius: var(--r-md); width: 100%; text-align: left; color: var(--ink); }
.checkrow + .checkrow { margin-top: 8px; }
.checkrow .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--ink3); flex: none; display: grid; place-items: center; }
.checkrow.on .box { background: var(--good); border-color: var(--good); color: #052016; box-shadow: 0 0 12px rgba(46,229,157,.6); }
.checkrow .box svg { width: 16px; height: 16px; opacity: 0; }
.checkrow.on .box svg { opacity: 1; }
.checkrow b { font-weight: 700; display: block; font-size: 14.5px; }
.checkrow small { color: var(--ink2); font-size: 12.5px; }
.checkrow .mono { margin-left: auto; }
.progress-strip { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--head-h)); z-index: 30; background: rgba(7,8,11,.82); backdrop-filter: blur(14px); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.progress-strip .bar { flex: 1; }
.swapses { margin-top: 18px; }
.swapses summary, .snaps summary, .simon summary { cursor: pointer; font-weight: 700; color: var(--ink2); font-size: 14px; padding: 8px 0; }

/* Hoja de ejercicio */
.sheet { position: fixed; inset: 0; z-index: 90; background: var(--bg); transform: translateY(100%); transition: transform .34s cubic-bezier(.2,.8,.2,1), visibility .34s; visibility: hidden; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.sheet.on { transform: none; visibility: visible; }
.sheet::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(500px 300px at 80% 0%, rgba(255,45,70,.16), transparent 70%); }
.sheet .bar-top { display: flex; align-items: center; gap: 8px; height: 54px; flex: none; position: relative; }
.sheet .bar-top .mono { flex: 1; text-align: center; }
.sheet .scroll { overflow-y: auto; flex: 1; padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; position: relative; }
.sheet .inner { max-width: 560px; margin: 0 auto; }
.stage { position: relative; height: min(50vh, 440px); background: #0C0E13; border-radius: 26px; overflow: hidden; margin: 0 auto; max-width: 560px; border: 1px solid var(--line2); box-shadow: inset 0 0 80px rgba(0,0,0,.6), 0 18px 40px rgba(0,0,0,.4); }
.stage canvas { width: 100% !important; height: 100% !important; display: block; }
.stage.isbad { border-color: rgba(255,45,70,.6); box-shadow: inset 0 0 90px rgba(255,20,50,.22), 0 0 30px rgba(255,45,70,.25); }
.stage .hint { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .12em; color: rgba(255,255,255,.35); text-transform: uppercase; pointer-events: none; }
.eqpill { position: absolute; top: 12px; left: 12px; max-width: 70%; display: grid; grid-template-columns: minmax(0,1fr) auto; column-gap: 8px; align-items: center; text-align: left; padding: 8px 10px 8px 12px; border-radius: 14px; background: rgba(10,12,17,.72); border: 1px solid var(--line2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--ink); z-index: 2; }
.eqpill .mono { grid-column: 1; font-size: 9.5px; color: var(--red); }
.eqpill b { grid-column: 1; font-size: 13px; line-height: 1.2; }
.eqpill svg { grid-column: 2; grid-row: 1 / 3; width: 17px; height: 17px; color: var(--ink3); }
.eqtip { position: absolute; top: 74px; left: 12px; right: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(10,12,17,.92); border: 1px solid var(--line2); font-size: 13.5px; z-index: 3; backdrop-filter: blur(12px); }
.verdict { position: absolute; top: 12px; right: 12px; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; z-index: 2; backdrop-filter: blur(8px); }
.verdict svg { width: 22px; height: 22px; }
.verdict.ok { background: rgba(46,229,157,.16); border: 1px solid rgba(46,229,157,.6); color: var(--good); box-shadow: 0 0 22px rgba(46,229,157,.45), inset 0 0 12px rgba(46,229,157,.25); }
.verdict.bad { background: rgba(255,45,70,.16); border: 1px solid rgba(255,45,70,.7); color: #FF5A6E; box-shadow: 0 0 22px rgba(255,45,70,.6), inset 0 0 12px rgba(255,45,70,.3); }
.badcap { position: absolute; left: 12px; right: 12px; bottom: 34px; display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: rgba(40,4,10,.8); border: 1px solid rgba(255,45,70,.55); color: #FFD5DB; font-size: 13.5px; font-weight: 600; z-index: 2; backdrop-filter: blur(10px); }
.badcap svg { width: 16px; height: 16px; flex: none; color: var(--red); margin-top: 2px; }
.stage::after { content: ""; position: absolute; inset: 10px; pointer-events: none; z-index: 1; border-radius: 18px;
  background: linear-gradient(var(--red), var(--red)) 0 0 / 16px 1.5px, linear-gradient(var(--red), var(--red)) 0 0 / 1.5px 16px, linear-gradient(var(--red), var(--red)) 100% 0 / 16px 1.5px, linear-gradient(var(--red), var(--red)) 100% 0 / 1.5px 16px,
    linear-gradient(var(--red), var(--red)) 0 100% / 16px 1.5px, linear-gradient(var(--red), var(--red)) 0 100% / 1.5px 16px, linear-gradient(var(--red), var(--red)) 100% 100% / 16px 1.5px, linear-gradient(var(--red), var(--red)) 100% 100% / 1.5px 16px; background-repeat: no-repeat; opacity: .55; }
.deck { max-width: 560px; margin: 10px auto 0; display: grid; gap: 8px; }

.views button { flex: 1 0 auto; height: 34px; padding: 0 12px; border-radius: 999px; background: rgba(10,12,17,.7); border: 1px solid var(--line2); color: var(--ink2); font-size: 12.5px; font-weight: 700; backdrop-filter: blur(8px); }
.views button.on { color: #fff; border-color: rgba(255,45,70,.7); background: rgba(255,45,70,.22); box-shadow: 0 0 14px rgba(255,45,70,.45); }
.deck .ctl { display: flex; gap: 6px; align-items: center; }
.deck .ctl > button { height: 34px; padding: 0 12px; border-radius: 999px; background: rgba(10,12,17,.72); border: 1px solid var(--line2); font-size: 12.5px; font-weight: 700; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; backdrop-filter: blur(8px); }

.deck .ctl svg { width: 15px; height: 15px; }
.tg { display: flex; padding: 3px; border-radius: 999px; background: rgba(10,12,17,.75); border: 1px solid var(--line2); backdrop-filter: blur(8px); }
.tg button { height: 28px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--ink2); display: inline-flex; align-items: center; gap: 4px; }

.tg button.on[data-bad="0"] { background: rgba(46,229,157,.2); color: var(--good); }
.tg button.on[data-bad="1"] { background: rgba(255,45,70,.25); color: #FF6A7D; }
.exname { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: .98; margin: 18px 0 10px; text-transform: uppercase; font-stretch: 80%; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.target { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }

.last { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; margin-top: 14px; }

.last .sug.up { background: linear-gradient(160deg, #FF3F57, #B50F27); border-color: rgba(255,45,70,.6); box-shadow: 0 0 24px rgba(255,45,70,.4); }
.plan-line { margin: 10px 2px 0; font-size: 14px; color: var(--ink); background: var(--red-tint); border: 1px solid rgba(255,45,70,.2); border-radius: 12px; padding: 10px 12px; }
.setrow { display: grid; grid-template-columns: 22px minmax(0,1fr) 68px 52px 44px; gap: 7px; align-items: center; padding: 8px 8px 8px 12px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line2); }

.setrow .r b { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.setrow .r small { display: block; color: var(--ink2); font-size: 11.5px; }
.setrow input { width: 100%; height: 42px; border-radius: 11px; border: 1px solid var(--line2); background: var(--bg1); text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 16px; color: var(--ink); }

.cues { counter-reset: c; display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }

.cues li::before { content: counter(c); width: 28px; height: 28px; border-radius: 9px; background: var(--red-soft); color: #FF6A7D; border: 1px solid rgba(255,45,70,.35); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.note { border-radius: var(--r-md); padding: 13px 14px; font-size: 14px; display: flex; gap: 10px; border: 1px solid var(--line2); }
.note.err { background: rgba(255,45,70,.07); border-color: rgba(255,45,70,.25); }
.note.err svg { color: var(--red); }

.sheet .navfoot { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-top: 18px; background: linear-gradient(transparent, var(--bg) 35%); }
.sheet .navfoot .wrap { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }

/* Mapa muscular, material, historial */
.bodymap { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; border-radius: var(--r-lg); background: var(--glass); border: 1px solid var(--line2); }

.bodymap svg { width: 100%; max-width: 150px; height: auto; }
.bodymap figcaption { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; color: var(--ink3); text-transform: uppercase; margin-top: 4px; }
.bm-body path { fill: #232835; stroke: rgba(191,208,255,.35); stroke-width: .6; }
.bodymap ellipse.m0 { fill: rgba(255,255,255,.04); }
.bodymap ellipse.m1 { fill: #FF6A2A; filter: drop-shadow(0 0 3px rgba(255,106,42,.9)); }
.bodymap ellipse.m2 { fill: rgba(255,138,80,.45); }
.bm-leg { grid-column: 1 / -1; display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--ink2); }
.bm-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

.eqcard { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px; align-items: start; }

.eqcard b { display: block; font-size: 15.5px; margin: 2px 0 4px; }

.hist .hh { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
.hist .hh b { display: block; font-size: 22px; font-weight: 800; margin-top: 2px; }
.hleg { display: flex; gap: 14px; font-size: 12px; color: var(--ink2); margin: 4px 0 10px; }
.hleg i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: 3px; }

.hrows { display: grid; gap: 6px; }
.hrow { display: grid; grid-template-columns: 42px minmax(0,1fr) 16px; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.hrow .hd { text-align: center; font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; color: var(--ink3); text-transform: uppercase; }

.hrow svg { width: 15px; height: 15px; color: var(--ink3); }

/* Calendario */
.cal .calh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

.cd { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--line); position: relative; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--ink2); font-variant-numeric: tabular-nums; overflow: hidden; }
.cd i { position: absolute; left: 0; bottom: 0; height: 3px; width: calc(var(--p) * 100%); background: var(--red); box-shadow: 0 0 8px var(--red); }
.cd.plan { border-color: rgba(255,45,70,.35); color: var(--ink); }

.calleg { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--ink2); }
.calleg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.calleg i.done { background: var(--good); } .calleg i.part { background: rgba(255,45,70,.5); } .calleg i.plan { border: 1px solid var(--red); } .calleg i.miss { border: 1px solid var(--warn); }
.calsum { display: flex; gap: 18px; margin-top: 10px; font-size: 13px; color: var(--ink2); }
.calsum b { color: var(--ink); font-size: 16px; }
.cald { margin-top: 12px; }
.cald h3 { margin: 6px 0 10px; font-size: 18px; font-weight: 800; }
.cstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 6px; margin-bottom: 12px; }
.cstats span { padding: 8px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 11px; color: var(--ink3); text-align: center; }
.cstats b { display: block; font-size: 16px; color: var(--ink); }
.cex { display: block; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); cursor: pointer; }

/* Progreso de pesos */
.lifts { display: grid; gap: 8px; }
.lift { display: grid; grid-template-columns: minmax(0,1fr) 80px 64px; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line2); text-align: left; color: var(--ink); }

.lift .ln small { color: var(--ink3); font-size: 11.5px; }
.lift .lv { text-align: right; }
.lift .lv b { display: block; font-size: 18px; font-weight: 800; }
.lift .lv small { font-family: var(--f-mono); font-size: 11px; }
.spark { width: 80px; height: 28px; }

/* Perfil */
.card.profile { margin-top: 14px; }
.pf { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }

.row2 { display: flex; gap: 8px; margin-top: 10px; }

/* Descanso y avisos */
.rest { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 40px); opacity: 0; visibility: hidden; pointer-events: none; z-index: 95; background: rgba(14,16,22,.92); border: 1px solid rgba(255,45,70,.45); color: #fff; border-radius: 999px; padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 24px rgba(255,45,70,.3); transition: transform .3s, opacity .3s, visibility .3s; min-width: 250px; backdrop-filter: blur(14px); }
.rest.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; pointer-events: auto; }
.rest.insheet { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
.rest b { font-family: var(--f-mono); font-size: 20px; font-weight: 600; color: var(--red); text-shadow: 0 0 12px rgba(255,45,70,.7); font-variant-numeric: tabular-nums; }
.rest span { font-size: 12.5px; color: rgba(255,255,255,.7); }
.rest button { margin-left: auto; height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.1); color: #fff; font-weight: 700; font-size: 13px; }
.toast { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; width: min(520px, calc(100vw - 24px)); transform: translate(-50%, -150%); z-index: 99; background: rgba(16,18,24,.94); border: 1px solid var(--line2); color: var(--ink); border-radius: 18px; box-shadow: 0 14px 40px rgba(0,0,0,.5); padding: 12px 14px; display: flex; gap: 12px; align-items: center; transition: transform .45s cubic-bezier(.2,.9,.25,1.15), visibility .45s; visibility: hidden; text-align: left; backdrop-filter: blur(16px); }
.toast.on { transform: translate(-50%, 0); visibility: visible; }
.toast .av { width: 40px; height: 40px; border-radius: 13px; background: var(--red); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 0 16px rgba(255,45,70,.6); }
.toast .av svg { width: 20px; height: 20px; }
.toast b { display: block; font-size: 12px; font-family: var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: #FF6A7D; font-weight: 600; }
.toast p { margin: 2px 0 0; font-size: 14.5px; font-weight: 600; line-height: 1.3; }
.toast.win { border-color: rgba(255,212,59,.5); box-shadow: 0 14px 40px rgba(0,0,0,.5), 0 0 30px rgba(255,212,59,.25); }
.toast.win .av { background: #FFD43B; color: #1B1400; box-shadow: 0 0 18px rgba(255,212,59,.7); }
.toast.win b { color: #FFD43B; }
#confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 120; display: none; }

/* Comida */
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.macro { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 13px; padding: 10px; color: var(--ink); }
.macro b { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.macro b small { font-size: 12px; font-weight: 600; opacity: .7; }
.macro span { display: block; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; opacity: .65; margin-bottom: 2px; }
.macro i { display: block; height: 4px; border-radius: 4px; margin-top: 7px; }
.meal { display: grid; grid-template-columns: 112px minmax(0,1fr); gap: 14px; align-items: center; background: var(--glass); border: 1px solid var(--line2); border-radius: var(--r-lg); padding: 12px; }
.meal + .meal { margin-top: 10px; }
.meal .pl { width: 112px; height: 112px; border-radius: 18px; background: radial-gradient(circle at 50% 40%, #232733, #12141A); display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); }
.meal .pl svg { width: 104px; height: 104px; }
.meal h4 { margin: 4px 0 6px; font-size: 16px; line-height: 1.18; font-weight: 800; text-wrap: balance; }
.meal .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.meal .acts button { height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; color: var(--ink); }
.meal .acts button.on { background: var(--good); color: #052016; border-color: var(--good); }
.meal .acts svg { width: 14px; height: 14px; }
.meal.eaten { border-color: rgba(46,229,157,.4); background: linear-gradient(180deg, rgba(46,229,157,.08), rgba(46,229,157,.02)); }
.mk { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink2); letter-spacing: .04em; }
.water { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.water button { width: 30px; height: 38px; border-radius: 8px 8px 11px 11px; border: 2px solid rgba(110,180,255,.55); background: transparent; }
.water button.on { background: linear-gradient(transparent 22%, #5DB2FF 22%); box-shadow: 0 0 10px rgba(93,178,255,.45); }
.seg { display: flex; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; height: 38px; border-radius: 999px; font-weight: 700; font-size: 13.5px; color: var(--ink2); white-space: nowrap; padding: 0 10px; }
.seg button.on { background: var(--bg4); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rcard { background: var(--glass); border: 1px solid var(--line2); border-radius: var(--r-lg); padding: 12px; text-align: left; display: grid; gap: 6px; align-content: start; color: var(--ink); }
.rcard .pl svg { width: 100%; height: auto; display: block; }
.rcard b { font-size: 14px; line-height: 1.2; font-weight: 800; }
.ing { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.ing b { font-variant-numeric: tabular-nums; font-weight: 800; }
.swap h3 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.swap h3 i { width: 10px; height: 10px; border-radius: 3px; }
.swap ul { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 14px; }
.swap li { break-inside: avoid; display: flex; justify-content: space-between; gap: 6px; font-size: 13.5px; padding: 6px 0; border-bottom: 1px dashed var(--line2); }

const Store = (() => {
  const KEY = 'saragym.v2', PREV = 'saragym.v2.prev', OLD = 'saragym.v1', DBN = 'saragym', OS = 'kv', KEEP = 30;
  let db = null; const listeners = [];
  const status = { ls: false, idb: false, persisted: false, lastSave: 0, ok: true, snaps: [] };
  const pad = (n) => String(n).padStart(2, '0');
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  function openDB() {
    return new Promise((res) => {
      let done = false; const fin = (v) => { if (!done) { done = true; res(v); } };
      try {
        const r = indexedDB.open(DBN, 1);

  }

  async function load() {

  let pending = null, timer = null;
  function save(S, now = false) {
    pending = S; clearTimeout(timer);
    if (now) flush(); else timer = setTimeout(flush, 120);
  }
  function flush() {
    if (!pending) return; const S = pending; pending = null;
    S.savedAt = Date.now(); S.rev = (S.rev || 0) + 1;
    const json = JSON.stringify(S); let ok = false;
    try { const cur = localStorage.getItem(KEY); if (cur) localStorage.setItem(PREV, cur); localStorage.setItem(KEY, json); ok = true; status.ls = true; } catch (e) { status.ls = false; }

      if (!r) return;
      if (!status.snaps.includes(dk)) { status.snaps.unshift(dk); status.snaps.sort().reverse(); }

  }

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') bye(); });

  /* Código de copia: JSON comprimido con base64 seguro */
  const encode = (S) => 'SG2.' + btoa(unescape(encodeURIComponent(JSON.stringify(S))));

  let restEnd = 0, restI = null;
  function startRest(sec, label) {
    const rl = $('#restL'); if (rl) rl.textContent = label || 'Descanso'; let buzzed = false;
    try { if (S.settings.beep !== false) { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } } catch (e) { }
    restEnd = Date.now() + sec * 1000; const el = $('#rest'); el.classList.add('on'); el.classList.toggle('insheet', $('#sheet').classList.contains('on'));
    clearInterval(restI); const tick = () => { const left = Math.max(0, Math.round((restEnd - Date.now()) / 1000)); $('#restT').textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`; if (left === 10 && !buzzed) { buzzed = true; try { S.settings.beep !== false && navigator.vibrate && navigator.vibrate(80); } catch (e) { } } if (!left) { stopRest(); beep(); try { S.settings.beep !== false && navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { } toast('Descanso terminado. ¡A por la siguiente serie!', 'SaraGym'); } };
    tick(); restI = setInterval(tick, 500);
  }
  function stopRest() { clearInterval(restI); $('#rest').classList.remove('on'); }

  /* Hoja de receta */
  function openRecipe(id, kcal) {
    const r = RECIPES.find(x => x.id === id), s = scale(r, kcal);
    $('#shPos').textContent = MEALS.find(m => m.k === r.meal).t;
    $('#shBody').innerHTML = `<div class="wrap"><div style="background:var(--bg2);border-radius:26px;display:grid;place-items:center;padding:18px">${PLATE.svg(r, 260)}</div>
      <h1 class="exname">${esc(r.n)}</h1><div class="chips"><span class="chip">${r.min} min</span><span class="chip red num">${s.k} kcal</span></div>
      <div class="macros" style="margin-top:12px">${macroBox('Proteína', s.p, 'var(--prot)').replace('class="macro"', 'class="macro" style="background:var(--bg2)"')}${macroBox('Carbohidrato', s.c, 'var(--carb)').replace('class="macro"', 'class="macro" style="background:var(--bg2)"')}${macroBox('Grasa', s.f, '#9D8FFF').replace('class="macro"', 'class="macro" style="background:var(--bg2)"')}</div>
      <h2 class="sec">Ingredientes <span class="mono">para ti</span></h2>${s.ing.map(i => `<div class="ing"><span>${esc(i.n)}</span><b>${i.lbl}</b></div>`).join('')}
      <p class="small muted">Sal, especias, limón, vinagre y hierbas libres.</p>
      <h2 class="sec">Pasos</h2><ol class="cues">${r.st.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`;
    $('#shNav').innerHTML = `<button class="btn block" id="shClose2">Cerrar</button>`; $('#shClose2').onclick = closeSheet;
    $('#sheet').classList.add('on'); $('#sheet').setAttribute('aria-hidden', 'false'); $('#shScroll').scrollTop = 0; document.body.style.overflow = 'hidden';
  }

  /* ---------- Bienvenida ---------- */
  function onboarding() {
    const o = $('#onb'); o.hidden = false; let step = 0; const p = S.profile; const tmp = { goal: p.goal || 'tonificar', age: p.age || '', weight: p.weight, height: p.height, days: [...S.days] };
    const steps = () => `<div class="steps">${[0, 1, 2, 3, 4].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`;
    const draw = () => {
      let body = '', foot = '';
      if (step === 0) { body = `<div class="bigmark">${MARK}</div><h1>Hola, <em>Sara.</em></h1><p class="muted" style="font-size:17px;margin:0">Esta app es solo tuya: tu rutina de siempre con la técnica en 3D, tus comidas y tu progreso. Vamos a dejarla lista en un minuto.</p>${installCard(true)}<div class="welcome-art"><img id="wArt" alt=""></div>
        <details class="snaps" style="margin-top:14px"><summary>¿Ya la usabas en otro móvil? Recupera tus datos</summary><div class="field" style="margin-top:10px"><label for="oBk">Pega tu código de copia</label><textarea id="oBk" spellcheck="false" placeholder="SG2…"></textarea></div><button class="btn sm dark" id="oBkGo" style="margin-top:8px">Recuperar</button><span class="small" id="oBkErr" style="color:var(--red);display:block;margin-top:6px"></span></details>`; foot = `<button class="btn block" id="nx">Empezar</button>`; }
      if (step === 1) { body = `<span class="mono">Paso 1 de 4</span><h1>¿Cuál es tu <em>objetivo?</em></h1><div id="g">${goalCards(tmp.goal)}</div><p class="small muted" style="margin-top:12px">Puedes cambiarlo cuando quieras en Ajustes.</p>`; }
      if (step === 2) { const b = tmp.weight && tmp.height ? tmp.weight / Math.pow(tmp.height / 100, 2) : null; body = `<span class="mono">Paso 2 de 4</span><h1>Tus <em>datos.</em></h1><p class="muted" style="margin:0 0 16px">Los usamos para calcular tus calorías y lo que te toca comer.</p>
        <div class="field"><label for="oA">Edad</label><input id="oA" type="number" inputmode="numeric" value="${tmp.age}" placeholder="Tu edad"></div>
        <div class="grid2" style="margin-top:10px"><div class="field"><label for="oW">Peso (kg)</label><input id="oW" type="number" step="0.1" inputmode="decimal" value="${tmp.weight ?? ''}" placeholder="Ej. 45,5"></div><div class="field"><label for="oH">Altura (cm)</label><input id="oH" type="number" inputmode="numeric" value="${tmp.height ?? ''}" placeholder="Ej. 146"></div></div>
        <div class="card" style="margin-top:14px"><span class="mono">Índice de masa corporal</span><div style="font-size:24px;font-weight:800" class="num" id="oB">${b ? fmt(b, 1) : '—'}</div><span class="small muted">Rango saludable de 18,5 a 25. Tu foco es más músculo y menos grasa, no bajar por bajar.</span></div><p class="small" id="oErr" style="color:var(--red)"></p>`; }
      if (step === 3) { body = `<span class="mono">Paso 3 de 4</span><h1>¿Qué días <em>entrenas?</em></h1><p class="muted" style="margin:0 0 16px">Tu plan tiene 4 sesiones de unas 2 horas. Se colocan solas en los días que elijas.</p><div class="days" id="oD">${DS.map((d, i) => `<button class="${tmp.days.includes(i) ? 'on' : ''}" data-d="${i}" aria-label="${DN[i]}">${d}</button>`).join('')}</div><p class="small muted" style="margin-top:14px" id="oDtxt"></p>`; }
      if (step === 4) {
        S.profile.goal = tmp.goal; S.profile.age = tmp.age; S.profile.height = tmp.height; S.profile.weight = tmp.weight; S.days = tmp.days;
        const N = nutrition(tmp.weight);
        body = `<span class="mono">Paso 4 de 4</span><h1>Tu plan <em>está listo.</em></h1><div class="result">
          <div class="card"><span class="mono">Día de entreno</span><div class="kbig">${fmt(N.train.kcal)} <small>kcal</small></div><div class="macros">${macroBox('Proteína', N.train.p, 'var(--prot)')}${macroBox('Carbo', N.train.c, 'var(--carb)')}${macroBox('Grasa', N.train.f, '#9D8FFF')}</div></div>
          <div class="card"><span class="mono">Día de descanso</span><div class="kbig">${fmt(N.rest.kcal)} <small>kcal</small></div><div class="macros">${macroBox('Proteína', N.rest.p, 'var(--prot)')}${macroBox('Carbo', N.rest.c, 'var(--carb)')}${macroBox('Grasa', N.rest.f, '#9D8FFF')}</div></div>
          <p class="small muted" style="margin:4px 0 0">Calculado con tu metabolismo basal (${fmt(N.bmr)} kcal), ${tmp.days.length} días de entreno y tu objetivo «${GOALS[tmp.goal].t}». Agua: unos ${fmt(N.water, 1)} L al día.</p></div>`;
        foot = `<button class="btn ghost" id="bk">Atrás</button><button class="btn" id="fin">Entrar</button>`;
      }
      if (!foot) foot = `<button class="btn ghost" id="bk">Atrás</button><button class="btn" id="nx">Siguiente</button>`;
      o.innerHTML = `<div class="inner wrap">${steps()}<div class="grow">${body}</div><div class="foot">${foot}</div></div>`;
      if (step === 0) { const im = $('#wArt'); if (gl3d) { try { const ex = EX3D.lungeBack; const prev = ex.thumbCam; ex.thumbCam = { az: 58, el: 10, d: 3.6, ty: .78 }; im.src = SG3D.thumb(ex, 600, 0xFAF8F8); ex.thumbCam = prev; THUMB.lungeBack = null; SG3D.thumb(ex, 260, 0xF7F3F2); } catch (e) { im.parentNode.hidden = true; } } else im.parentNode.hidden = true; }
      if (step === 0) $('#oBkGo').onclick = () => { try { const o = Store.decode($('#oBk').value); o.onboarded = true; restoreFrom(o); $('#onb').hidden = true; scheduleLove(); toast('Tus datos están de vuelta.', 'SaraGym', 'save'); } catch (e) { $('#oBkErr').textContent = 'El código no es válido. Cópialo entero, desde SG2.'; } };
      if (step === 1) $$('#g .goal').forEach(b => b.onclick = () => { tmp.goal = b.dataset.goal; $('#g').innerHTML = goalCards(tmp.goal); $$('#g .goal').forEach(x => x.onclick = b.onclick); });
      if (step === 2) ['#oA', '#oW', '#oH'].forEach(id => $(id).oninput = () => { const w = parseFloat($('#oW').value.replace(',', '.')), h = parseFloat($('#oH').value); if (w > 0 && h > 0) $('#oB').textContent = fmt(w / Math.pow(h / 100, 2), 1); });
      if (step === 3) { const upd = () => { const n = tmp.days.length; $('#oDtxt').textContent = n === 4 ? 'Perfecto: una sesión de tu plan cada día que vas.' : n > 4 ? `Con ${n} días, el 5.º es el circuito funcional de tu plan.` : `Con ${n} día${n > 1 ? 's' : ''}, las 4 sesiones van rotando cada semana.`; }; upd();
        $$('#oD button').forEach(b => b.onclick = () => { const d = +b.dataset.d; if (tmp.days.includes(d)) { if (tmp.days.length > 1) tmp.days = tmp.days.filter(x => x !== d); } else tmp.days.push(d); tmp.days.sort(); b.classList.toggle('on', tmp.days.includes(d)); upd(); }); }
      const nx = $('#nx'); if (nx) nx.onclick = () => {
        if (step === 2) { const a = parseInt($('#oA').value), w = parseFloat($('#oW').value.replace(',', '.')), h = parseFloat($('#oH').value); if (!(a >= 14 && a <= 90)) { $('#oErr').textContent = 'Pon tu edad para calcular bien las calorías.'; return; } if (!(w > 30 && w < 150) || !(h > 120 && h < 210)) { $('#oErr').textContent = 'Revisa el peso y la altura.'; return; } tmp.age = a; tmp.weight = w; tmp.height = h; }
        step++; draw(); o.scrollTop = 0; };
      const bk = $('#bk'); if (bk) bk.onclick = () => { step--; draw(); };
      const fin = $('#fin'); if (fin) fin.onclick = () => {
        const k = key(today()); S.onboarded = true; S.profile.start = k; S.profile.startWeight = tmp.weight; S.profile.target = defaultTarget();
        const ex = S.measures.find(x => x.date === k && !x.src); if (ex) ex.weight = tmp.weight; else S.measures.push({ date: k, weight: tmp.weight });
        save(true); o.hidden = true; render(); setTimeout(() => love(true), 1500); scheduleLove();
      };
    };
    draw();
  }

  /* ---------- Eventos globales ---------- */
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-letter],[data-pause],[data-ready],[data-short],[data-open],[data-warm],[data-fin],[data-finish],[data-recipe],[data-start],[data-backup],[data-undo],[data-install],[data-goalok]'); if (!t) return;
    if (t.dataset.backup) { copyBackup(null); return; }
    if (t.dataset.letter) { if (t.dataset.letter === 'close') openLetter = null; else { openLetter = t.dataset.letter; (S.lettersRead = S.lettersRead || {})[openLetter] = Date.now(); save(true); confetti(.7); } render(); return; }
    if (t.dataset.pause) { ev.preventDefault(); const mk = key(monday(today())); S.pauses = S.pauses || {}; if (S.pauses[mk]) delete S.pauses[mk]; else { S.pauses[mk] = true; toast('Semana en pausa. Tu racha te espera intacta. Cuídate.', 'Sin culpa', 'heart'); } save(); render(); return; }
    if (t.dataset.ready) { const L = logOf(t.dataset.key, t.dataset.sid), v = +t.dataset.ready; L.ready = L.ready === v ? null : v; save(); render(); if (L.ready === 3) toast('Hoy es día de intentar superar algo. A por ello.', 'Con ganas', 'flame'); return; }
    if (t.dataset.short) { const L = logOf(t.dataset.key, t.dataset.sid); L.short = !L.short; save(); render(); return; }
    if (t.dataset.goalok) { S.goalCard = false; save(); render(); return; }
    if (t.dataset.install) { if (t.dataset.install === 'off') { try { localStorage.setItem('sg.install.off', '1'); } catch (e) { } render(); } else if (installEvt) { installEvt.prompt(); installEvt = null; } return; }
    if (t.dataset.undo) { if (S.log[t.dataset.undo]) S.log[t.dataset.undo].done = false; save(); render(); return; }
    if (t.dataset.open) { const id = t.dataset.open; if (EXI[id]) openEx(id, t.dataset.sid, t.dataset.key); return; }
    if (t.dataset.recipe) { openRecipe(t.dataset.recipe, +t.dataset.kcal || 400); return; }
    if (t.dataset.warm) { const L = logOf(t.dataset.key, t.dataset.sid); L.warm[t.dataset.warm] = !L.warm[t.dataset.warm]; save(); render(); return; }
    if (t.dataset.fin) { const L = logOf(t.dataset.key, t.dataset.sid); L.fin = !L.fin; save(); render(); return; }
    if (t.dataset.finish) { const L = logOf(t.dataset.finish, t.dataset.sid); const prevK = Object.keys(S.log).filter(x => x < t.dataset.finish && S.log[x].done).sort().pop(), gap = prevK ? Math.round((parse(t.dataset.finish) - parse(prevK)) / 864e5) : 0;
      L.done = true; L.doneAt = Date.now(); save(true); render(); stopRest(); const stt = streak();
      if (stt.thisN === stt.goal && key(monday(parse(t.dataset.finish))) === key(monday(today()))) { confetti(1.3); celebrate('Semana redonda', `Has cumplido tus ${stt.goal} entrenos de esta semana. Así se construye.`, 'trophy'); }
      else if (gap > 14) love(false, 'back'); else if (L.ready === 1) love(false, 'pride'); else love(true);
      checkHitos(); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); return; }
    if (t.dataset.start) { const k = t.dataset.day; if (S.log[k] && progressOf(k).done) return; S.log[k] = { s: t.dataset.start, sets: {}, kg: {}, reps: {}, warm: {}, fin: false, done: false, extra: true }; save(); render(); window.scrollTo(0, 0); }
  });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#sheet').classList.contains('on')) closeSheet(); else closeDrawer(); } });

  function boot() {
    document.body.insertAdjacentHTML('afterbegin', `
      <header class="top"><div class="wrap"><button class="iconbtn" id="menuBtn" aria-label="Abrir menú">${ic('menu')}</button><a class="logo" href="#inicio" style="text-decoration:none;color:inherit">${MARK}<span>Sara<i>Gym</i></span></a><a class="chip" id="topChip" href="#ajustes" aria-label="Estado del guardado"></a></div></header>
      <div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" aria-label="Menú"></aside>`);
    document.body.insertAdjacentHTML('beforeend', `
      <div class="tabs"><nav aria-label="Pestañas"><a href="#inicio" data-r="inicio">${ic('home')}Inicio</a><a href="#hoy" data-r="hoy,dia,semana,ejercicios">${ic('dumb')}Entreno</a><a href="#comida" data-r="comida,recetas,intercambios">${ic('food')}Comida</a><a href="#logros" data-r="logros">${ic('trophy')}Logros</a><a href="#calendario" data-r="calendario,fecha,progreso">${ic('cal')}Historial</a></nav></div>
      <section class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-label="Detalle"><div class="wrap"><div class="bar-top"><button class="iconbtn" id="shClose" aria-label="Cerrar">${ic('x')}</button><span class="mono" id="shPos"></span><span style="width:40px"></span></div></div><div class="scroll" id="shScroll"><div class="inner" id="shBody"></div></div><div class="navfoot"><div class="wrap" id="shNav"></div></div></section>
      <div class="rest" id="rest" role="status"><div><span id="restL">Descanso</span><br><b id="restT">0:00</b></div><button id="restAdd" aria-label="Quince segundos más">+15"</button><button id="restSkip">Saltar</button></div>
      <button class="toast" id="toast" aria-live="polite"><span class="av" id="toastI">${ic('heart')}</span><span><b id="toastT"></b><p id="toastP"></p></span></button>
      <div class="onb" id="onb" hidden></div>`);
    $('#menuBtn').onclick = openDrawer; $('#scrim').onclick = closeDrawer; $('#drawer').addEventListener('click', (e) => { if (e.target.closest('a')) closeDrawer(); });
    $('#shClose').onclick = closeSheet; $('#restSkip').onclick = stopRest; $('#restAdd').onclick = () => { restEnd += 15000; }; $('#toast').onclick = () => { const t = $('#toast'); clearTimeout(t._h); t.classList.remove('on'); setTimeout(nextToast, 300); };
    readHash(); render();
    S.onboarded = true; scheduleLove(); setTimeout(() => love(), 25000);
    Store.onChange(() => { chip(true); const si = $('#saveInfo'); if (si) si.innerHTML = saveInfo(); });
    // pre-generar miniaturas de la sesión de hoy y del resto
    setTimeout(() => { Object.keys(EXI).forEach(wantThumb); }, 400);
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { } }
  Store.load().then((o) => {
    const m = migrate(o); S = m.s; storageOk = Store.status.ls || Store.status.idb;
    booting = false; HC = null;
    if (o && m.fresh) checkHitos(true);
    if (!o) S.seen = [];
    boot();
    if (o && m.fresh) Store.save(S, true);
  });
})();

</script>
</body></html>
