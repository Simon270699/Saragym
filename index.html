<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SaraGym"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>SaraGym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>/* Capa: columna móvil centrada; cabecera fija arriba, barra de pestañas abajo, cajón lateral izquierdo */
:root {
  --bg: #FFFFFF; --bg2: #F7F3F2; --bg3: #EFE9E8; --ink: #151215; --ink2: #5E5659; --ink3: #8F8588;
  --line: #EAE3E2; --red: #D7263D; --red2: #B31B30; --red-soft: #FCE9EC; --red-tint: #FFF5F6;
  --good: #23885B; --good-soft: #E5F4EC; --warn: #B7791F;
  --carb: #E9A13B; --prot: #D7263D; --fat: #6C5CE7;
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r-lg: 22px; --r-md: 16px; --r-sm: 11px;
  --nav-h: 66px; --head-h: 58px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: rgba(255,255,255,.94); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 8px; }
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); }
.num { font-variant-numeric: tabular-nums; }

/* Cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: rgba(255,255,255,.94); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.top .wrap { height: var(--head-h); display: flex; align-items: center; gap: 12px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); }
.iconbtn:active { background: var(--bg2); }
.iconbtn svg { width: 22px; height: 22px; }
.logo { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.logo svg { width: 30px; height: 30px; flex: none; }
.logo i { color: var(--red); font-style: italic; font-weight: 800; }
.top .chip { margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--bg2); font-size: 12.5px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
.chip.red { background: var(--red-soft); color: var(--red2); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.ink { background: var(--ink); color: #fff; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* Cajón lateral */
.scrim { position: fixed; inset: 0; background: rgba(21,18,21,.36); z-index: 96; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(330px, 86vw); background: var(--bg); z-index: 97; transform: translateX(-102%); transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility .3s; visibility: hidden; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); box-shadow: 12px 0 40px rgba(0,0,0,.08); }
.drawer.on { transform: none; visibility: visible; }
.drawer .dhead { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
.drawer .dhead .logo { font-size: 24px; }
.drawer .dhead p { margin: 8px 0 0; color: var(--ink2); font-size: 13.5px; }
.dnav { overflow-y: auto; padding: 10px 10px 24px; flex: 1; }
.dnav a, .dnav summary { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer; list-style: none; }
.dnav summary::-webkit-details-marker { display: none; }
.dnav a:active, .dnav summary:active { background: var(--bg2); }
.dnav a.on { background: var(--red-soft); color: var(--red2); }
.dnav svg { width: 20px; height: 20px; flex: none; }
.dnav details > div { padding: 2px 0 6px 32px; display: grid; }
.dnav details > div a { font-weight: 500; font-size: 14.5px; padding: 9px 12px; color: var(--ink2); }
.dnav details > div a small { margin-left: auto; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; color: var(--ink3); }
.dnav details > div a.today small { color: var(--red); }
.dnav .chev { margin-left: auto; transition: transform .2s; width: 16px; height: 16px; color: var(--ink3); }
.dnav details[open] .chev { transform: rotate(90deg); }
.dfoot { padding: 14px 18px 18px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink3); }

/* Barra inferior */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: rgba(255,255,255,.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs nav { max-width: 560px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--ink3); font-size: 11px; font-weight: 600; letter-spacing: .01em; }
.tabs a svg { width: 23px; height: 23px; }
.tabs a.on { color: var(--red); }

/* Tipografía de vista */
.vhead { padding-top: 22px; padding-bottom: 6px; }
.vhead h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 10vw, 46px); line-height: .98; letter-spacing: -.035em; margin: 8px 0 0; text-wrap: balance; }
.vhead h1 em { font-style: italic; color: var(--red); font-weight: 800; }
.vhead p { color: var(--ink2); margin: 10px 0 0; max-width: 46ch; }
h2.sec { font-family: var(--f-display); font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin: 30px 0 12px; display: flex; align-items: baseline; gap: 10px; }
h2.sec .mono { margin-left: auto; font-weight: 500; }
.stack { display: grid; gap: 12px; }
.muted { color: var(--ink2); }
.small { font-size: 13px; }

/* Tarjetas */
.card { background: var(--bg2); border-radius: var(--r-lg); padding: 16px; }
.card.white { background: var(--bg); border: 1px solid var(--line); }
.card.ink { background: var(--ink); color: #fff; }
.card.red { background: var(--red); color: #fff; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 22px; border-radius: 999px; background: var(--red); color: #fff; font-weight: 700; font-size: 15.5px; letter-spacing: -.005em; text-decoration: none; }
.btn:active { transform: scale(.98); background: var(--red2); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.white { background: #fff; color: var(--ink); }
.btn.dark { background: var(--ink); }
.btn.sm { height: 38px; padding: 0 15px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.link { color: var(--red); font-weight: 700; text-decoration: none; font-size: 14px; }

/* Héroe de inicio */
.hero { position: relative; overflow: hidden; border-radius: 26px; background: var(--ink); color: #fff; padding: 20px 18px 18px; margin-top: 14px; }
.hero .mono { color: rgba(255,255,255,.55); }
.hero h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(36px, 11vw, 50px); line-height: .95; letter-spacing: -.04em; margin: 10px 0 0; }
.hero h2 em { color: #FF4D63; font-style: italic; }
.hero p { margin: 10px 0 0; color: rgba(255,255,255,.72); font-size: 14px; max-width: 30ch; }
.hero .row { display: flex; gap: 10px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.hero .timer { position: absolute; top: 16px; right: 16px; border: 1px solid rgba(255,255,255,.16); border-radius: 12px; padding: 8px 10px; text-align: right; }
.hero .timer b { display: block; font-family: var(--f-mono); font-size: 17px; color: #FF4D63; font-weight: 600; letter-spacing: .02em; }
.hero .timer span { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .14em; color: rgba(255,255,255,.55); }
.hero .thumbstrip { display: flex; gap: 6px; margin-top: 16px; }
.hero .thumbstrip img { width: 54px; height: 54px; border-radius: 12px; background: #fff; object-fit: cover; }

/* Tira semanal */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; }
.week a { text-decoration: none; color: var(--ink); background: var(--bg2); border-radius: 14px; padding: 9px 0 8px; text-align: center; display: grid; gap: 4px; justify-items: center; }
.week a .d { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; color: var(--ink3); }
.week a .n { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }
.week a .s { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.week a.tr .s { background: var(--red); }
.week a.ok .s { background: var(--good); }
.week a.today { background: var(--ink); color: #fff; }
.week a.today .d { color: rgba(255,255,255,.6); }

/* Indicadores */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--bg2); border-radius: var(--r-md); padding: 14px; display: grid; gap: 4px; min-width: 0; }
.tile b { font-family: var(--f-display); font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile b small { font-size: 14px; font-weight: 700; color: var(--ink2); letter-spacing: 0; margin-left: 2px; }
.tile .delta { font-size: 12.5px; font-weight: 600; }
.up { color: var(--good); } .down { color: var(--red); } .flat { color: var(--ink3); }
.tile.wide { grid-column: 1 / -1; }
.bar { height: 8px; border-radius: 999px; background: var(--bg3); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--red); border-radius: inherit; }

/* Gráficos */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--f-mono); font-size: 10px; fill: var(--ink3); }
.chart .lbl { fill: var(--ink); font-weight: 600; }

/* Sesión */
.blockhead { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; }
.blockhead h3 { margin: 0; font-family: var(--f-display); font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.blockhead .mono { margin-left: auto; }
.exrow { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 12px 8px 8px; text-align: left; width: 100%; }
.exrow + .exrow { margin-top: 8px; }
.exrow img, .ph { width: 74px; height: 74px; border-radius: 12px; background: var(--bg2); object-fit: cover; display: block; }
.exrow .t { font-weight: 700; font-size: 15px; line-height: 1.2; }
.exrow .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.exrow .meta span { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .04em; padding: 3px 7px; border-radius: 7px; background: var(--bg2); color: var(--ink2); }
.exrow .meta span.r { background: var(--red-soft); color: var(--red2); }
.exrow.done { background: var(--good-soft); border-color: transparent; }
.ring { width: 38px; height: 38px; }
.supl { border-left: 2px solid var(--red); margin-left: 6px; padding-left: 10px; }
.supl-tag { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; color: var(--red); text-transform: uppercase; margin: -2px 0 8px 8px; }
.checkrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--bg2); border-radius: var(--r-md); width: 100%; text-align: left; }
.checkrow + .checkrow { margin-top: 8px; }
.checkrow .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--ink3); flex: none; display: grid; place-items: center; }
.checkrow.on .box { background: var(--good); border-color: var(--good); color: #fff; }
.checkrow .box svg { width: 16px; height: 16px; opacity: 0; }
.checkrow.on .box svg { opacity: 1; }
.checkrow b { font-weight: 700; display: block; font-size: 14.5px; }
.checkrow small { color: var(--ink2); font-size: 12.5px; }
.checkrow .mono { margin-left: auto; }
.progress-strip { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--head-h)); z-index: 30; background: rgba(255,255,255,.95); backdrop-filter: blur(10px); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.progress-strip .bar { flex: 1; }

/* Hoja de ejercicio */
.sheet { position: fixed; inset: 0; z-index: 90; background: var(--bg); transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility .32s; visibility: hidden; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.sheet.on { transform: none; visibility: visible; }
.sheet .bar-top { display: flex; align-items: center; gap: 8px; height: 54px; flex: none; }
.sheet .bar-top .mono { flex: 1; text-align: center; }
.sheet .scroll { overflow-y: auto; flex: 1; padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
.sheet .inner { max-width: 560px; margin: 0 auto; }
.stage { position: relative; height: min(48vh, 430px); background: #FAF8F8; border-radius: 24px; overflow: hidden; margin: 0 auto; max-width: 560px; }
.stage canvas { width: 100% !important; height: 100% !important; display: block; }
.stage .ctl { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.stage .ctl button { height: 34px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.92); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-size: 12.5px; font-weight: 700; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.stage .ctl button.on { background: var(--ink); color: #fff; }
.stage .ctl .sp { margin-left: auto; }
.stage .ctl svg { width: 15px; height: 15px; }
.stage .hint { position: absolute; top: 12px; left: 14px; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .14em; color: var(--ink3); text-transform: uppercase; }
.stage .live { position: absolute; top: 10px; right: 12px; display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .14em; color: var(--red); }
.stage .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.exname { font-family: var(--f-display); font-weight: 800; font-size: 27px; line-height: 1.04; letter-spacing: -.03em; margin: 18px 0 8px; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.target { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
.target div { background: var(--bg2); border-radius: 13px; padding: 10px 8px; text-align: center; }
.target b { display: block; font-size: clamp(13px, 3.9vw, 17px); white-space: nowrap; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.target span { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em; color: var(--ink3); text-transform: uppercase; }
.setrow { display: grid; grid-template-columns: 22px minmax(0,1fr) 68px 52px 44px; gap: 7px; align-items: center; padding: 8px 8px 8px 12px; border-radius: 14px; background: var(--bg2); }
.setrow + .setrow { margin-top: 6px; }
.setrow .i { font-family: var(--f-mono); font-size: 12px; color: var(--ink3); font-weight: 600; }
.setrow .r b { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.setrow .r small { display: block; color: var(--ink2); font-size: 11.5px; }
.setrow input { width: 100%; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
.setrow input:focus { border-color: var(--red); outline: none; }
.setrow .ok { width: 44px; height: 40px; border-radius: 10px; background: #fff; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--ink3); }
.setrow .ok svg { width: 20px; height: 20px; }
.setrow.on { background: var(--good-soft); }
.setrow.on .ok { background: var(--good); border-color: var(--good); color: #fff; }
.setrow.warm { background: #fff; border: 1.5px dashed var(--line); }
.cues { counter-reset: c; display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.cues li { counter-increment: c; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.cues li::before { content: counter(c); width: 28px; height: 28px; border-radius: 9px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.note { border-radius: var(--r-md); padding: 13px 14px; font-size: 14px; display: flex; gap: 10px; }
.note.err { background: var(--bg2); }
.note.inj { background: var(--red-soft); color: #6E1222; }
.note svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.sheet .navfoot { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-top: 12px; background: linear-gradient(transparent, #fff 30%); }
.sheet .navfoot .wrap { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }

/* Temporizador de descanso */
.rest { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 40px); opacity: 0; visibility: hidden; pointer-events: none; z-index: 95; background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: transform .3s, opacity .3s, visibility .3s; min-width: 250px; }
.rest.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; pointer-events: auto; }
.rest.insheet { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
.rest b { font-family: var(--f-mono); font-size: 20px; font-weight: 600; letter-spacing: .02em; color: #FF4D63; font-variant-numeric: tabular-nums; }
.rest span { font-size: 12.5px; color: rgba(255,255,255,.7); }
.rest button { margin-left: auto; height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.12); color: #fff; font-weight: 700; font-size: 13px; }

/* Mensajes emergentes */
.toast { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; width: min(520px, calc(100vw - 24px)); transform: translate(-50%, -150%); z-index: 99; background: #fff; border-radius: 18px; box-shadow: 0 14px 40px rgba(60,10,20,.18), 0 0 0 1px var(--line); padding: 12px 14px; display: flex; gap: 12px; align-items: center; transition: transform .45s cubic-bezier(.2,.9,.25,1.15), visibility .45s; visibility: hidden; text-align: left; }
.toast.on { transform: translate(-50%, 0); visibility: visible; }
.toast .av { width: 40px; height: 40px; border-radius: 13px; background: var(--red); color: #fff; display: grid; place-items: center; flex: none; }
.toast .av svg { width: 20px; height: 20px; }
.toast b { display: block; font-size: 12px; font-family: var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--red); font-weight: 600; }
.toast p { margin: 2px 0 0; font-size: 14.5px; font-weight: 600; line-height: 1.3; }

/* Comida */
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.macro { background: rgba(255,255,255,.08); border-radius: 13px; padding: 10px; }
.card .macro { background: var(--bg); }
.card.ink .macro { background: rgba(255,255,255,.09); color: #fff; }
.macro b { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.macro b small { font-size: 12px; font-weight: 600; opacity: .7; }

/* SaraGym 3D — maniquí femenino articulado con IK, props de gimnasio y reproductor de animaciones */
(function () {

  function M(color, rough = .62, metal = 0) { return new T.MeshStandardMaterial({ color, roughness: rough, metalness: metal }); }
  const MAT = {
    skin: M(0xE9CDBE, .55), top: M(0xD7263D, .5), tights: M(0x1F2027, .74), shoe: M(0xFBFBFB, .5),

  const FING = [[.0182, .026, .017, .014, -.077], [.006, .029, .019, .015, -.079], [-.006, .027, .018, .014, -.077], [-.0172, .021, .014, .012, -.072]];

/* SaraGym — guardado: doble copia (IndexedDB + localStorage), copia previa, copias diarias y estado visible */
const Store = (() => {
  const KEY = 'saragym.v2', PREV = 'saragym.v2.prev', OLD = 'saragym.v1', DBN = 'saragym', OS = 'kv', KEEP = 30;

  const pad = (n) => String(n).padStart(2, '0');
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  function openDB() {
    return new Promise((res) => {
      let done = false; const fin = (v) => { if (!done) { done = true; res(v); } };

        const r = indexedDB.open(DBN, 1);

    });
  }

    db = await openDB(); status.idb = !!db;

  }

    if (!pending) return; const S = pending; pending = null;
    S.savedAt = Date.now(); S.rev = (S.rev || 0) + 1;

      if (!r) return;
      if (!status.snaps.includes(dk)) { status.snaps.unshift(dk); status.snaps.sort().reverse(); }

  const encode = (S) => 'SG2.' + btoa(unescape(encodeURIComponent(JSON.stringify(S))));

        <div id="sets">${sl.map((st, i) => { const pw = prev && prev.sets[(sl[0].w ? i - 1 : i)]; return `<div class="setrow ${st.w ? 'warm' : ''} ${done[i] ? 'on' : ''}" data-i="${i}"><span class="i">${st.w ? 'C' : (sl[0].w ? i : i + 1)}</span><span class="r"><b>${st.reps}${typeof st.reps === 'number' ? '' : ''}</b><small>${st.w ? 'Calent. · 30"' : `Serie ${sl[0].w ? i : i + 1}${e.side ? ' · lado' : ''}`}</small></span><input type="text" inputmode="decimal" placeholder="${st.w ? 'kg' : (sg ? fmt(sg.kg, 1) : (pw && pw.w ? fmt(pw.w, 1) : 'kg'))}" value="${kg[i] != null ? String(kg[i]).replace('.', ',') : ''}" id="kg-${id}-${i}" class="kg" aria-label="Kilos serie ${i + 1}"><input type="text" inputmode="numeric" placeholder="${typeof st.reps === 'number' ? st.reps : 'reps'}" value="${rp[i] ?? ''}" id="rp-${id}-${i}" class="rp" aria-label="Repeticiones serie ${i + 1}"><button class="ok" aria-label="Marcar serie">${ic('check')}</button></div>`; }).join('')}</div>
        <p class="small muted" style="margin:8px 2px 0">Si no escribes las reps, cuento las del plan.</p>
        <div class="field" style="margin-top:16px"><label for="exnote">Nota para la próxima vez</label><textarea id="exnote" class="plain" placeholder="Ej.: asiento en el 4, subir peso, cuidado con el hombro…">${esc(nt ? nt.t : '')}</textarea></div>` : (e ? `<p class="small muted" style="margin-top:12px">Así aparece en tu plan. Para apuntar series, ábrelo desde el día que toca.</p>` : '')}
      <h2 class="sec">Técnica</h2><ol class="cues">${X.c.map(c => `<li>${esc(c)}</li>`).join('')}</ol>
      <div class="stack" style="margin-top:14px"><div class="note err">${ic('warn')}<span><b>Error típico:</b> ${esc(X.e)}</span></div>${X.note ? `<div class="note inj">${ic('info')}<span>${esc(X.note)}</span></div>` : ''}</div>
    </div>`;
    $('#shNav').innerHTML = list ? `<button class="btn ghost" id="shPrev" ${idx <= 0 ? 'disabled style="opacity:.4"' : ''}>${ic('back')}Anterior</button><button class="btn" id="shNext" style="flex:1">${idx < list.length - 1 ? `Siguiente ${ic('chev')}` : 'Volver al día'}</button>` : `<button class="btn block" id="shClose2">Cerrar</button>`;
    sh.classList.add('on'); sh.setAttribute('aria-hidden', 'false'); $('#shScroll').scrollTop = 0; document.body.style.overflow = 'hidden';
    if (gl3d) {
      try { if (!viewer) viewer = new SG3D.Viewer($('#stage')); else $('#stage').appendChild(viewer.r.domElement); viewer.c = $('#stage'); viewer.playing = true; viewer.speed = 1; viewer.show(EX3D[id]); }
      catch (err) { gl3d = false; }
    }
    if (!gl3d) $('#stage').insertAdjacentHTML('beforeend', `<div class="empty" style="position:absolute;inset:40px 16px auto">Este navegador no puede mostrar la figura 3D.</div>`);
    bindSheet();
  }
  function findPlan(id) { for (const sid of Object.keys(SESSIONS)) { const e = exList(sid).find(x => x.id === id); if (e) return e; } return null; }
  function bindSheet() {
    const pp = $('#pp'); if (pp) pp.onclick = () => { if (!viewer) return; viewer.playing = !viewer.playing; pp.innerHTML = viewer.playing ? ic('pause') : ic('play'); pp.setAttribute('aria-label', viewer.playing ? 'Pausa' : 'Seguir'); };
    $$('[data-sp]').forEach(b => b.onclick = () => { if (viewer) viewer.speed = +b.dataset.sp; $$('[data-sp]').forEach(x => x.classList.toggle('on', x === b)); });
    $$('[data-vw]').forEach(b => b.onclick = () => { if (viewer) viewer.view(+b.dataset.vw); });
    $$('#sets .setrow').forEach(row => {
      const i = +row.dataset.i, inp = row.querySelector('.kg'), rin = row.querySelector('.rp');
      inp.oninput = () => { const L = logOf(cur.k, cur.sid); (L.kg[cur.id] = L.kg[cur.id] || [])[i] = num(inp.value); save(); };
      rin.oninput = () => { const L = logOf(cur.k, cur.sid); L.reps = L.reps || {}; (L.reps[cur.id] = L.reps[cur.id] || [])[i] = num(rin.value); save(); };
      row.querySelector('.ok').onclick = () => {
        const L = logOf(cur.k, cur.sid); const a = L.sets[cur.id] = L.sets[cur.id] || []; a[i] = !a[i]; row.classList.toggle('on', a[i]);
        save();
        if (a[i]) { const st = setList(cur.e)[i]; startRest(st.w ? 30 : cur.e.rest); beatCheck(i); if (Math.random() < .25 && !(S.log[cur.k].cel || {})[cur.id]) love(); }
        else stopRest();
      };
    });
    const xn = $('#exnote'); if (xn) xn.oninput = () => { const t = xn.value.trim(); if (t) S.exNotes[cur.id] = { t: xn.value, d: cur.k }; else delete S.exNotes[cur.id]; save(); };
    const nx = $('#shNext'), pv = $('#shPrev'), c2 = $('#shClose2');
    if (nx) nx.onclick = () => { if (cur.idx < cur.list.length - 1) openEx(cur.list[cur.idx + 1].id, cur.sid, cur.k); else closeSheet(); };
    if (pv) pv.onclick = () => { if (cur.idx > 0) openEx(cur.list[cur.idx - 1].id, cur.sid, cur.k); };
    if (c2) c2.onclick = closeSheet;
  }
  function closeSheet() { $('#sheet').classList.remove('on'); $('#sheet').setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; if (viewer) viewer.stop(); $('#rest').classList.remove('insheet'); render(); }

  /* Descanso */
  let restEnd = 0, restI = null;
  function startRest(sec) {
    restEnd = Date.now() + sec * 1000; const el = $('#rest'); el.classList.add('on'); el.classList.toggle('insheet', $('#sheet').classList.contains('on'));
    clearInterval(restI); const tick = () => { const left = Math.max(0, Math.round((restEnd - Date.now()) / 1000)); $('#restT').textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`; if (!left) { stopRest(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { } toast('Descanso terminado. ¡A por la siguiente serie!', 'SaraGym'); } };
    tick(); restI = setInterval(tick, 500);
  }
  function stopRest() { clearInterval(restI); $('#rest').classList.remove('on'); }

  /* Hoja de receta */
  function openRecipe(id, kcal) {
    const r = RECIPES.find(x => x.id === id), s = scale(r, kcal);
    $('#shPos').textContent = MEALS.find(m => m.k === r.meal).t;
    $('#shBody').innerHTML = `<div class="wrap"><div style="background:var(--bg2);border-radius:26px;display:grid;place-items:center;padding:18px">${PLATE.svg(r, 260)}</div>
      <h1 class="exname">${esc(r.n)}</h1><div class="chips"><span class="chip">${r.min} min</span><span class="chip red num">${s.k} kcal</span></div>
      <div class="macros" style="margin-top:12px">${macroBox('Proteína', s.p, 'var(--prot)').replace('class="macro"', 'class="macro" style="background:var(--bg2)"')}${macroBox('Carbohidrato', s.c, 'var(--carb)').replace('class="macro"', 'class="macro" style="background:var(--bg2)"')}${macroBox('Grasa', s.f, '#9D8FFF').replace('class="macro"', 'class="macro" style="background:var(--bg2)"')}</div>
      <h2 class="sec">Ingredientes <span class="mono">para ti</span></h2>${s.ing.map(i => `<div class="ing"><span>${esc(i.n)}</span><b>${i.lbl}</b></div>`).join('')}
      <p class="small muted">Sal, especias, limón, vinagre y hierbas libres.</p>
      <h2 class="sec">Pasos</h2><ol class="cues">${r.st.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`;
    $('#shNav').innerHTML = `<button class="btn block" id="shClose2">Cerrar</button>`; $('#shClose2').onclick = closeSheet;
    $('#sheet').classList.add('on'); $('#sheet').setAttribute('aria-hidden', 'false'); $('#shScroll').scrollTop = 0; document.body.style.overflow = 'hidden';
  }

  /* ---------- Bienvenida ---------- */
  function onboarding() {
    const o = $('#onb'); o.hidden = false; let step = 0; const p = S.profile; const tmp = { goal: p.goal || 'tonificar', age: p.age || '', weight: p.weight, height: p.height, days: [...S.days] };
    const steps = () => `<div class="steps">${[0, 1, 2, 3, 4].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`;
    const draw = () => {
      let body = '', foot = '';
      if (step === 0) { body = `<div class="bigmark">${MARK}</div><h1>Hola, <em>Sara.</em></h1><p class="muted" style="font-size:17px;margin:0">Esta app es solo tuya: tu rutina de siempre con la técnica en 3D, tus comidas y tu progreso. Vamos a dejarla lista en un minuto.</p>${installCard(true)}<div class="welcome-art"><img id="wArt" alt=""></div>
        <details class="snaps" style="margin-top:14px"><summary>¿Ya la usabas en otro móvil? Recupera tus datos</summary><div class="field" style="margin-top:10px"><label for="oBk">Pega tu código de copia</label><textarea id="oBk" spellcheck="false" placeholder="SG2…"></textarea></div><button class="btn sm dark" id="oBkGo" style="margin-top:8px">Recuperar</button><span class="small" id="oBkErr" style="color:var(--red);display:block;margin-top:6px"></span></details>`; foot = `<button class="btn block" id="nx">Empezar</button>`; }
      if (step === 1) { body = `<span class="mono">Paso 1 de 4</span><h1>¿Cuál es tu <em>objetivo?</em></h1><div id="g">${goalCards(tmp.goal)}</div><p class="small muted" style="margin-top:12px">Puedes cambiarlo cuando quieras en Ajustes.</p>`; }
      if (step === 2) { const b = tmp.weight && tmp.height ? tmp.weight / Math.pow(tmp.height / 100, 2) : null; body = `<span class="mono">Paso 2 de 4</span><h1>Tus <em>datos.</em></h1><p class="muted" style="margin:0 0 16px">Los usamos para calcular tus calorías y lo que te toca comer.</p>
        <div class="field"><label for="oA">Edad</label><input id="oA" type="number" inputmode="numeric" value="${tmp.age}" placeholder="Tu edad"></div>
        <div class="grid2" style="margin-top:10px"><div class="field"><label for="oW">Peso (kg)</label><input id="oW" type="number" step="0.1" inputmode="decimal" value="${tmp.weight ?? ''}" placeholder="Ej. 45,5"></div><div class="field"><label for="oH">Altura (cm)</label><input id="oH" type="number" inputmode="numeric" value="${tmp.height ?? ''}" placeholder="Ej. 146"></div></div>
        <div class="card" style="margin-top:14px"><span class="mono">Índice de masa corporal</span><div style="font-size:24px;font-weight:800" class="num" id="oB">${b ? fmt(b, 1) : '—'}</div><span class="small muted">Rango saludable de 18,5 a 25. Tu foco es más músculo y menos grasa, no bajar por bajar.</span></div><p class="small" id="oErr" style="color:var(--red)"></p>`; }
      if (step === 3) { body = `<span class="mono">Paso 3 de 4</span><h1>¿Qué días <em>entrenas?</em></h1><p class="muted" style="margin:0 0 16px">Tu plan tiene 4 sesiones de unas 2 horas. Se colocan solas en los días que elijas.</p><div class="days" id="oD">${DS.map((d, i) => `<button class="${tmp.days.includes(i) ? 'on' : ''}" data-d="${i}" aria-label="${DN[i]}">${d}</button>`).join('')}</div><p class="small muted" style="margin-top:14px" id="oDtxt"></p>`; }
      if (step === 4) {
        S.profile.goal = tmp.goal; S.profile.age = tmp.age; S.profile.height = tmp.height; S.profile.weight = tmp.weight; S.days = tmp.days;
        const N = nutrition(tmp.weight);
        body = `<span class="mono">Paso 4 de 4</span><h1>Tu plan <em>está listo.</em></h1><div class="result">
          <div class="card"><span class="mono">Día de entreno</span><div class="kbig">${fmt(N.train.kcal)} <small>kcal</small></div><div class="macros">${macroBox('Proteína', N.train.p, 'var(--prot)')}${macroBox('Carbo', N.train.c, 'var(--carb)')}${macroBox('Grasa', N.train.f, '#9D8FFF')}</div></div>
          <div class="card"><span class="mono">Día de descanso</span><div class="kbig">${fmt(N.rest.kcal)} <small>kcal</small></div><div class="macros">${macroBox('Proteína', N.rest.p, 'var(--prot)')}${macroBox('Carbo', N.rest.c, 'var(--carb)')}${macroBox('Grasa', N.rest.f, '#9D8FFF')}</div></div>
          <p class="small muted" style="margin:4px 0 0">Calculado con tu metabolismo basal (${fmt(N.bmr)} kcal), ${tmp.days.length} días de entreno y tu objetivo «${GOALS[tmp.goal].t}». Agua: unos ${fmt(N.water, 1)} L al día.</p></div>`;
        foot = `<button class="btn ghost" id="bk">Atrás</button><button class="btn" id="fin">Entrar</button>`;
      }
      if (!foot) foot = `<button class="btn ghost" id="bk">Atrás</button><button class="btn" id="nx">Siguiente</button>`;
      o.innerHTML = `<div class="inner wrap">${steps()}<div class="grow">${body}</div><div class="foot">${foot}</div></div>`;
      if (step === 0) { const im = $('#wArt'); if (gl3d) { try { const ex = EX3D.lungeBack; const prev = ex.thumbCam; ex.thumbCam = { az: 58, el: 10, d: 3.6, ty: .78 }; im.src = SG3D.thumb(ex, 600, 0xFAF8F8); ex.thumbCam = prev; THUMB.lungeBack = null; SG3D.thumb(ex, 260, 0xF7F3F2); } catch (e) { im.parentNode.hidden = true; } } else im.parentNode.hidden = true; }
      if (step === 0) $('#oBkGo').onclick = () => { try { const o = Store.decode($('#oBk').value); o.onboarded = true; restoreFrom(o); $('#onb').hidden = true; scheduleLove(); toast('Tus datos están de vuelta.', 'SaraGym', 'save'); } catch (e) { $('#oBkErr').textContent = 'El código no es válido. Cópialo entero, desde SG2.'; } };
      if (step === 1) $$('#g .goal').forEach(b => b.onclick = () => { tmp.goal = b.dataset.goal; $('#g').innerHTML = goalCards(tmp.goal); $$('#g .goal').forEach(x => x.onclick = b.onclick); });
      if (step === 2) ['#oA', '#oW', '#oH'].forEach(id => $(id).oninput = () => { const w = parseFloat($('#oW').value.replace(',', '.')), h = parseFloat($('#oH').value); if (w > 0 && h > 0) $('#oB').textContent = fmt(w / Math.pow(h / 100, 2), 1); });
      if (step === 3) { const upd = () => { const n = tmp.days.length; $('#oDtxt').textContent = n === 4 ? 'Perfecto: una sesión de tu plan cada día que vas.' : n > 4 ? `Con ${n} días, el 5.º es el circuito funcional de tu plan.` : `Con ${n} día${n > 1 ? 's' : ''}, las 4 sesiones van rotando cada semana.`; }; upd();
        $$('#oD button').forEach(b => b.onclick = () => { const d = +b.dataset.d; if (tmp.days.includes(d)) { if (tmp.days.length > 1) tmp.days = tmp.days.filter(x => x !== d); } else tmp.days.push(d); tmp.days.sort(); b.classList.toggle('on', tmp.days.includes(d)); upd(); }); }
      const nx = $('#nx'); if (nx) nx.onclick = () => {
        if (step === 2) { const a = parseInt($('#oA').value), w = parseFloat($('#oW').value.replace(',', '.')), h = parseFloat($('#oH').value); if (!(a >= 14 && a <= 90)) { $('#oErr').textContent = 'Pon tu edad para calcular bien las calorías.'; return; } if (!(w > 30 && w < 150) || !(h > 120 && h < 210)) { $('#oErr').textContent = 'Revisa el peso y la altura.'; return; } tmp.age = a; tmp.weight = w; tmp.height = h; }
        step++; draw(); o.scrollTop = 0; };
      const bk = $('#bk'); if (bk) bk.onclick = () => { step--; draw(); };
      const fin = $('#fin'); if (fin) fin.onclick = () => {
        const k = key(today()); S.onboarded = true; S.profile.start = k; S.profile.startWeight = tmp.weight; S.profile.target = defaultTarget();
        const ex = S.measures.find(x => x.date === k && !x.src); if (ex) ex.weight = tmp.weight; else S.measures.push({ date: k, weight: tmp.weight });
        save(true); o.hidden = true; render(); setTimeout(() => love(true), 1500); scheduleLove();
      };
    };
    draw();
  }

  /* ---------- Eventos globales ---------- */
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-open],[data-warm],[data-fin],[data-finish],[data-recipe],[data-start],[data-backup],[data-undo],[data-install]'); if (!t) return;
    if (t.dataset.backup) { copyBackup(null); return; }
    if (t.dataset.install) { if (t.dataset.install === 'off') { try { localStorage.setItem('sg.install.off', '1'); } catch (e) { } render(); } else if (installEvt) { installEvt.prompt(); installEvt = null; } return; }
    if (t.dataset.undo) { if (S.log[t.dataset.undo]) S.log[t.dataset.undo].done = false; save(); render(); return; }
    if (t.dataset.open) { const id = t.dataset.open; if (EXI[id]) openEx(id, t.dataset.sid, t.dataset.key); return; }
    if (t.dataset.recipe) { openRecipe(t.dataset.recipe, +t.dataset.kcal || 400); return; }
    if (t.dataset.warm) { const L = logOf(t.dataset.key, t.dataset.sid); L.warm[t.dataset.warm] = !L.warm[t.dataset.warm]; save(); render(); return; }
    if (t.dataset.fin) { const L = logOf(t.dataset.key, t.dataset.sid); L.fin = !L.fin; save(); render(); return; }
    if (t.dataset.finish) { const L = logOf(t.dataset.finish, t.dataset.sid); L.done = true; L.doneAt = Date.now(); save(true); render(); stopRest(); love(true); checkHitos(); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); return; }
    if (t.dataset.start) { const k = t.dataset.day; if (S.log[k] && progressOf(k).done) return; S.log[k] = { s: t.dataset.start, sets: {}, kg: {}, reps: {}, warm: {}, fin: false, done: false, extra: true }; save(); render(); window.scrollTo(0, 0); }
  });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#sheet').classList.contains('on')) closeSheet(); else closeDrawer(); } });

  function boot() {
    document.body.insertAdjacentHTML('afterbegin', `
      <header class="top"><div class="wrap"><button class="iconbtn" id="menuBtn" aria-label="Abrir menú">${ic('menu')}</button><a class="logo" href="#inicio" style="text-decoration:none;color:inherit">${MARK}<span>Sara<i>Gym</i></span></a><a class="chip" id="topChip" href="#ajustes" aria-label="Estado del guardado"></a></div></header>
      <div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" aria-label="Menú"></aside>`);
    document.body.insertAdjacentHTML('beforeend', `
      <div class="tabs"><nav aria-label="Pestañas"><a href="#inicio" data-r="inicio">${ic('home')}Inicio</a><a href="#hoy" data-r="hoy,dia,semana,ejercicios">${ic('dumb')}Entreno</a><a href="#comida" data-r="comida,recetas,intercambios">${ic('food')}Comida</a><a href="#logros" data-r="logros">${ic('trophy')}Logros</a><a href="#progreso" data-r="progreso">${ic('chart')}Progreso</a></nav></div>
      <section class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-label="Detalle"><div class="wrap"><div class="bar-top"><button class="iconbtn" id="shClose" aria-label="Cerrar">${ic('x')}</button><span class="mono" id="shPos"></span><span style="width:40px"></span></div></div><div class="scroll" id="shScroll"><div class="inner" id="shBody"></div></div><div class="navfoot"><div class="wrap" id="shNav"></div></div></section>
      <div class="rest" id="rest" role="status"><div><span>Descanso</span><br><b id="restT">0:00</b></div><button id="restSkip">Saltar</button></div>
      <button class="toast" id="toast" aria-live="polite"><span class="av" id="toastI">${ic('heart')}</span><span><b id="toastT"></b><p id="toastP"></p></span></button>
      <div class="onb" id="onb" hidden></div>`);
    $('#menuBtn').onclick = openDrawer; $('#scrim').onclick = closeDrawer; $('#drawer').addEventListener('click', (e) => { if (e.target.closest('a')) closeDrawer(); });
    $('#shClose').onclick = closeSheet; $('#restSkip').onclick = stopRest; $('#toast').onclick = () => { const t = $('#toast'); clearTimeout(t._h); t.classList.remove('on'); setTimeout(nextToast, 300); };
    readHash(); render();
    if (!S.onboarded) onboarding(); else { scheduleLove(); setTimeout(() => love(), 25000); }
    Store.onChange(() => { chip(true); const si = $('#saveInfo'); if (si) si.innerHTML = saveInfo(); });
    // pre-generar miniaturas de la sesión de hoy y del resto
    setTimeout(() => { Object.keys(EXI).forEach(wantThumb); }, 400);
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { } }
  Store.load().then((o) => {
    const m = migrate(o); S = m.s; storageOk = Store.status.ls || Store.status.idb;
    booting = false; HC = null;
    if (o && m.fresh) checkHitos(true);
    if (!o) S.seen = [];
    boot();
    if (o && m.fresh) Store.save(S, true);
  });
})();

</script>
</body></html>
